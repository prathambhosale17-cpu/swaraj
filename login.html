<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नागरिक प्रवेश व नोंदणी • Swarajya Authentication Portal</title>
    <meta name="description" content="Chhatrapati Shivaji Maharaj Inspired Citizen Welfare, Sign-in, Sign-up and Firebase Auth">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                            900: '#78350f'
                        }
                    }
                }
            }
        };
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDK (v9/v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!-- Modular CSS Stylesheet -->
    <link rel="stylesheet" href="./public/css/styles.css">
</head>

<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

    <!-- Global Application Root -->
    <div id="app"></div>

    <!-- Global Floating Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none max-w-sm w-full"></div>

    <!-- Global Modal Anchor -->
    <div id="modal-container"></div>

    <!-- Topic-wise Modular JS Architecture -->
    <script src="./public/js/config.js"></script>
    <script src="./public/js/firebase-auth.js"></script>
    <script src="./public/js/api.js"></script>
    <script src="./public/js/modules/auth.js"></script>
    <script src="./public/js/modules/safety.js"></script>
    <script src="./public/js/modules/health.js"></script>
    <script src="./public/js/modules/agriculture.js"></script>
    <script src="./public/js/modules/profile.js"></script>
    <script src="./public/js/modules/admin.js"></script>
    <script src="./public/js/app.js"></script>

    <script>
        // If already logged in, redirect or display logout option
        window.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (!user) {
                const app = document.getElementById('app');
                if (app) {
                    app.innerHTML = renderAuthScreen();
                    initAuthEvents();
                }
            }
        });
    </script>

</body>

</html>
